global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules for error monitoring
rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'fovea'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
