# Model Configuration
# Defines which models to use for each task type and their loading parameters

models:
  video_summarization:
    selected: "qwen-2-5-vl-7b"
    options:
      qwen-2-5-vl-7b:
        model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 8
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "fast"
        description: "Compact VLM, ungated, fits well on A10G with room for inference"
      llama-4-maverick:
        model_id: "meta-llama/Llama-4-Maverick"
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 62
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "fast"
        description: "MoE model with 17B active parameters, multimodal, 10M context"
      gemma-3-27b:
        model_id: "google/gemma-3-27b-it"
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 14
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "very_fast"
        description: "Document analysis, OCR, multilingual support (gated)"
      internvl3-78b:
        model_id: "OpenGVLab/InternVL3-78B"
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 40
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "medium"
        description: "SOTA benchmarks, scientific reasoning"
      pixtral-large:
        model_id: "mistralai/Pixtral-Large-Instruct-2411"
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 62
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "medium"
        description: "Long context (128k), batch processing"
      qwen2-5-vl-72b:
        model_id: "Qwen/Qwen2.5-VL-72B-Instruct"
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 36
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "fast"
        description: "Proven stable, good baseline"
      # CPU-compatible VLMs (GGUF)
      qwen2-5-vl-3b-gguf:
        model_id: "Qwen/Qwen2.5-VL-3B-Instruct-GGUF"
        quantization: "gguf_q4_k_m"
        framework: "llama_cpp"
        vram_gb: 0
        cpu_memory_gb: 3
        cpu_compatible: true
        speed: "fast"
        description: "Qwen2.5-VL 3B GGUF, fast multimodal on CPU"
      # CPU-compatible VLMs (Transformers)
      smolvlm-2-2b:
        model_id: "HuggingFaceTB/SmolVLM-Instruct"
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 5
        cpu_compatible: true
        speed: "fast"
        description: "SmolVLM 2.2B, 3-4x faster than Qwen2-VL, low tokens/image"
      moondream-2b:
        model_id: "vikhyat/moondream2"
        quantization: "int8"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 4
        cpu_compatible: true
        speed: "moderate"
        description: "CPU-optimized 2B VLM, ~10s/frame, runs well on CPU/MPS"
      smolvlm-500m:
        model_id: "HuggingFaceTB/SmolVLM-500M-Instruct"
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 2
        cpu_compatible: true
        speed: "very_fast"
        description: "SmolVLM 500M, ultra-compact for edge, under 1GB at int8"
      moondream-0-5b:
        model_id: "vikhyat/moondream-0.5b"
        quantization: "int4"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 1
        cpu_compatible: true
        speed: "very_fast"
        description: "Tiny 500M VLM, 816MB at int4, for edge devices"
      # External APIs (always CPU-compatible)
      claude-sonnet-4-5:
        model_id: "claude-sonnet-4-5"
        framework: "external_api"
        provider: "anthropic"
        api_endpoint: "https://api.anthropic.com/v1/messages"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
        cpu_compatible: true
        speed: "fast"
        description: "Anthropic Claude Sonnet 4.5, vision capable, API-based"
      gpt-4o:
        model_id: "gpt-4o"
        framework: "external_api"
        provider: "openai"
        api_endpoint: "https://api.openai.com/v1/chat/completions"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
        cpu_compatible: true
        speed: "fast"
        description: "OpenAI GPT-4 Omni, vision capable, API-based"
      gemini-2-5-flash:
        model_id: "gemini-2.5-flash"
        framework: "external_api"
        provider: "google"
        api_endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
        cpu_compatible: true
        speed: "very_fast"
        description: "Google Gemini 2.5 Flash, multimodal, API-based"

