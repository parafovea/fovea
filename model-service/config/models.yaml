      qwen-3-vl-8b:
        model_id: "Qwen/Qwen3-VL-8B-Instruct"
        architecture: {kind: "qwen3-vl"}
        quantization: "4bit"
        framework: "sglang"
        vram_gb: 9
        cpu_memory_gb: 0
        cpu_compatible: false
        speed: "fast"
        description: "Qwen3-VL 8B Instruct — 256K native context, ungated, current default"
      qwen-3-vl-8b-thinking:
        model_id: "Qwen/Qwen3-VL-8B-Thinking"
