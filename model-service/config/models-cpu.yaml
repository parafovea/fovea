# CPU-Only Model Configuration
# Optimized for resource-constrained deployments without GPU (e.g., t3.xlarge with 16GB RAM)
# All selected models are CPU-compatible with efficient memory usage

models:
  video_summarization:
    # Smallest viable VLM for live-demo latency: SmolVLM 500M int8 is
    # ~2GB resident with "very_fast" per-frame caption on CPU and ships
    # under the real public repo `HuggingFaceTB/SmolVLM-500M-Instruct`.
    # Switch to qwen2-5-vl-3b-gguf or smolvlm-2-2b for production CPU
    # deployments that want more nuanced multi-frame summaries.
    selected: "smolvlm-500m"
    options:
      # CPU-compatible VLMs
      qwen2-5-vl-3b-gguf:
        model_id: "Qwen/Qwen2.5-VL-3B-Instruct-GGUF"
        architecture: {kind: "qwen2.5-vl"}
        quantization: "gguf_q4_k_m"
        framework: "llama_cpp"
        vram_gb: 0
        cpu_memory_gb: 3
        cpu_compatible: true
        speed: "fast"
        description: "Qwen2.5-VL 3B GGUF, fast multimodal on CPU"
      smolvlm-2-2b:
        model_id: "HuggingFaceTB/SmolVLM-Instruct"
        architecture: {kind: "smolvlm"}
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 5
        cpu_compatible: true
        speed: "fast"
        description: "SmolVLM 2.2B, 3-4x faster than Qwen2-VL, low tokens/image"
      moondream-2b:
        model_id: "vikhyat/moondream2"
        architecture: {kind: "moondream"}
        quantization: "int8"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 4
        cpu_compatible: true
        speed: "moderate"
        description: "CPU-optimized 2B VLM, ~10s/frame, runs well on CPU/MPS"
      smolvlm-500m:
