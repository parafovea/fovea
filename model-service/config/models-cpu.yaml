inference:
  max_memory_per_model: "auto"
  offload_threshold: 0.85
  # Warm-load every selected model at startup. Cold-start on the first
  # user request would cost minutes of unresponsive UI on CPU; eating
  # that latency at boot once is always the right tradeoff, and the
  # docker healthcheck's `start_period` accounts for it so dependent
  # services don't release until warm-up completes.
  warmup_on_startup: true
  default_batch_size: 1
  max_batch_size: 4  # Lower for CPU
  # Hard cap on frames the VLM summarizer processes regardless of what
  # the request asks for. CPU VLMs run ~10-30 s/frame; without this
  # cap, an unspecified-or-default frontend request of 30 frames takes
  # 5-15 min and stalls the demo. Pinned at 3 here for the smolvlm-500m
  # + 14 s test clip; GPU deployments raise this in models.yaml.
  max_video_frames: 3
