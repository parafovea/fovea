        architecture: {kind: "moondream"}
        quantization: "int4"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 1
        cpu_compatible: true
        speed: "very_fast"
        description: "Tiny 500M VLM, 816MB at int4, for edge devices"
      moondream-3:
        model_id: "vikhyatk/moondream3"
        architecture: {kind: "moondream"}
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 2
        cpu_compatible: true
        speed: "very_fast"
        description: "Moondream 3, March 2026, 40% faster than v2, CPU/MPS-optimized"
      # External APIs (always CPU-compatible)
      claude-sonnet-4-5:
        model_id: "claude-sonnet-4-5"
        architecture:
          kind: "claude-vision-api"
        framework: "external_api"
        provider: "anthropic"
        api_endpoint: "https://api.anthropic.com/v1/messages"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
        cpu_compatible: true
        speed: "fast"
        description: "Anthropic Claude Sonnet 4.5, vision capable, API-based"
      gpt-4o:
        model_id: "gpt-4o"
        architecture:
          kind: "openai-vision-api"
