# CPU-Only Model Configuration
# Optimized for resource-constrained deployments without GPU (e.g., t3.xlarge with 16GB RAM)
# All selected models are CPU-compatible with efficient memory usage

models:
  video_summarization:
    selected: "qwen2-5-vl-3b-gguf"
    options:
      # CPU-compatible VLMs
      qwen2-5-vl-3b-gguf:
        model_id: "Qwen/Qwen2.5-VL-3B-Instruct-GGUF"
        architecture: {kind: "qwen2.5-vl"}
        quantization: "gguf_q4_k_m"
        framework: "llama_cpp"
        vram_gb: 0
        cpu_memory_gb: 3
        cpu_compatible: true
        speed: "fast"
        description: "Qwen2.5-VL 3B GGUF, fast multimodal on CPU"
      smolvlm-2-2b:
        model_id: "HuggingFaceTB/SmolVLM-Instruct"
        architecture: {kind: "smolvlm"}
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 5
        cpu_compatible: true
        speed: "fast"
        description: "SmolVLM 2.2B, 3-4x faster than Qwen2-VL, low tokens/image"
      moondream-2b:
        model_id: "vikhyat/moondream2"
        architecture: {kind: "moondream"}
        quantization: "int8"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 4
        cpu_compatible: true
        speed: "moderate"
        description: "CPU-optimized 2B VLM, ~10s/frame, runs well on CPU/MPS"
      smolvlm-500m:
        model_id: "HuggingFaceTB/SmolVLM-500M-Instruct"
        architecture: {kind: "smolvlm"}
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 2
        cpu_compatible: true
        speed: "very_fast"
        description: "SmolVLM 500M, ultra-compact for edge, under 1GB at int8"
      moondream-0-5b:
        model_id: "vikhyat/moondream-0.5b"
        architecture: {kind: "moondream"}
        quantization: "int4"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 1
        cpu_compatible: true
        speed: "very_fast"
        description: "Tiny 500M VLM, 816MB at int4, for edge devices"
      moondream-3:
        model_id: "vikhyatk/moondream3"
        architecture: {kind: "moondream"}
        quantization: "none"
        framework: "transformers"
        vram_gb: 0
        cpu_memory_gb: 2
        cpu_compatible: true
        speed: "very_fast"
        description: "Moondream 3, March 2026, 40% faster than v2, CPU/MPS-optimized"
      # External APIs (always CPU-compatible)
      claude-sonnet-4-5:
        model_id: "claude-sonnet-4-5"
        architecture:
          kind: "claude-vision-api"
        framework: "external_api"
        provider: "anthropic"
        api_endpoint: "https://api.anthropic.com/v1/messages"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
        cpu_compatible: true
        speed: "fast"
        description: "Anthropic Claude Sonnet 4.5, vision capable, API-based"
      gpt-4o:
        model_id: "gpt-4o"
        architecture:
          kind: "openai-vision-api"
        framework: "external_api"
        provider: "openai"
        api_endpoint: "https://api.openai.com/v1/chat/completions"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
        cpu_compatible: true
        speed: "fast"
        description: "OpenAI GPT-4 Omni, vision capable, API-based"
      gemini-2-5-flash:
        model_id: "gemini-2.5-flash"
        architecture:
          kind: "gemini-vision-api"
        framework: "external_api"
        provider: "google"
        api_endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
        requires_api_key: true
        vram_gb: 0
        cpu_memory_gb: 0
