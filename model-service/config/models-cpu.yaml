  object_detection:
    # The ONNX exports of YOLO-World v2 published on HuggingFace split
    # the CLIP text encoder out as a separate graph, so the ONNX session
    # requires a precomputed `txt_feats` input that the existing
    # YOLOWorldONNXLoader does not assemble. The Ultralytics PyTorch
    # checkpoint bundles text encoding into a single forward pass and
    # runs on CPU at acceptable demo latency, so switch to that on
    # CPU-only deployments. Future work: extend the ONNX loader to also
    # download the matching CLIP-text encoder ONNX and feed both inputs.
    selected: "yolo-world-v2"
    options:
      yolo-world-v2:
        model_id: "yolov8l-worldv2.pt"
        architecture:
          kind: "yolo-world"
        framework: "pytorch"
        vram_gb: 2
        cpu_memory_gb: 2
        cpu_compatible: true
        speed: "real_time"
        fps: 52
        description: "Speed and accuracy balance, image prompts"
      # CPU-optimized detection with ONNX. Public Instemic export of
      # the Ultralytics YOLO-World v2 small weights (AGPL-3.0). The
      # loader in onnx/yolo_world.py walks a fallback filename chain so
      # this repo's `yolov8s-worldv2.onnx` resolves without renaming.
      yolo-world-s-onnx:
