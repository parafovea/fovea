packages:
  - annotation-tool
  - server
  - packages/*

# Shared dependency versions, defined once and referenced from each package via
# "catalog:". Consolidates versions that previously diverged between the server
# and the frontend.
catalog:
  typescript: ^5.3.3
  zod: ^4.6.6
  axios: ^1.20.0
  '@opentelemetry/exporter-trace-otlp-http': ^0.223.0
  '@opentelemetry/resources': ^2.12.0
  '@opentelemetry/semantic-conventions': ^1.39.0
