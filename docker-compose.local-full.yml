# Local full-stack override: brings up the multi-user-mode backend
# AND a CPU model-service compiled with ENABLE_AUDIO=1 so transcription
# (faster-whisper) and diarization (pyannote.audio) work on the local
# install. The production demo at demo.fovea.video runs WITHOUT a
# model-service (DEMO_MODE=false drops it from the compose target);
# this override is the inverse for local development.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local-full.yml up -d --build
name: fovea-local-full

services:
  model-service:
    build:
      context: ./model-service
      dockerfile: Dockerfile
      args:
        # recommended = base + bitsandbytes (no vllm / sglang / sam-2).
        # The CVPR booth backup laptop exercises VLM summarization,
        # LLM ontology + claim extraction, ONNX object detection,
        # faster-whisper transcription, and pyannote speaker
        # diarization — every one of which runs cleanly on the
        # recommended set. full pulls sam-2 from a github clone +
        # vllm + sglang which inflate the image past 8 GB and
        # silently fail the Dockerfile retry block on macOS arm64
        # (sam-2's CUDA-flavoured build script). ENABLE_AUDIO=1
        # still pins CPU-only torch wheels before pyannote so
        # libcudart.so is never linked.
        BUILD_MODE: recommended
        DEVICE: cpu
        ENABLE_AUDIO: 1
        PRELOAD_MODELS: false
    environment:
      - DEVICE=cpu
      - MODEL_CONFIG_PATH=/config/models-cpu.yaml
      - ENABLE_AUDIO=1
