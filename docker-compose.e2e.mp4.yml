# Override that points the e2e backend + mock model-service at the real
# microvent MP4 corpus in <repo>/videos instead of the royalty-free webm
# fixtures, so the regression/tours end-to-end walkthroughs (which need an
# H.264 corpus + channel:chrome) run instead of self-skipping. Used only for
# the dedicated tour run; the standard e2e stack keeps serving ./test-videos.
services:
  backend:
    environment:
      STORAGE_PATH: /videos
    volumes:
      - ./videos:/videos:rw
  mock-model-service:
    environment:
      STORAGE_PATH: /videos
    volumes:
      - ./videos:/videos:rw
