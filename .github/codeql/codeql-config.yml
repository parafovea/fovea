name: Fovea CodeQL Config

paths-ignore:
  # Vendored Mock Service Worker. The file is generated by `msw init`
  # and the upstream banner explicitly says "Please do NOT modify this
  # file." The js/missing-origin-verification alert it triggers on the
  # internal message handler is a known false positive: service workers
  # can only be registered from their own origin, so event.source is
  # by construction same-origin. Suppressing the file at the analyzer
  # level rather than editing it keeps regeneration safe.
  - annotation-tool/public/mockServiceWorker.js
