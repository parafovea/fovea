name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'annotation-tool/src/**'
      - 'server/src/**'
      - 'model-service/src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'annotation-tool/src/**'
      - 'server/src/**'
      - 'model-service/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'model-service/pyproject.toml'

      - name: Install libvips (required by sharp)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install documentation dependencies
        run: |
          cd docs && npm ci

      - name: Install annotation-tool and server dependencies (for TypeDoc)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (required by server TypeDoc)
        run: cd server && pnpm exec prisma generate

      - name: Install model-service dependencies (for Sphinx)
        run: |
          cd model-service
          pip install -e ".[docs]"

      - name: Generate API documentation
        run: |
          cd docs
          ./scripts/generate-api-docs.sh

      - name: Build documentation
        run: |
          cd docs
          npm run build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
