name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    # Backstop so a wedged build fails fast instead of burning the full 6 h
    # GitHub Actions job ceiling.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          # Frontend and backend pull from the pnpm-workspace lockfile
          # at the repo root, so their build context is `.` and the
          # Dockerfile path is qualified. docker.yml has this right;
          # the prior release.yml shipped with `context: ./annotation-
          # tool` and `./server` which made buildx fail with
          # "annotation-tool: not found" because once the context is
          # the package directory the COPY annotation-tool/... line
          # resolves to <context>/annotation-tool which does not
          # exist (it would be /annotation-tool/annotation-tool).
          # amd64 only: the prior linux/amd64,linux/arm64 matrix built the
          # arm64 variant under QEMU emulation (10-50x slower), pushing the
          # frontend/backend jobs toward the 6 h ceiling. docker.yml (the dev
          # image workflow) ships amd64-only and these release images match it.
          # If arm64 images are ever required, build them on native
          # ubuntu-*-arm runners and merge manifests rather than emulating.
          - name: frontend
            context: .
            file: annotation-tool/Dockerfile
            platforms: linux/amd64
          - name: backend
            context: .
            file: server/Dockerfile
            platforms: linux/amd64
          # model-service entries keep their context at ./model-service
          # because the Dockerfile COPYs `pyproject.toml`, `src`, `config`,
          # `scripts` from paths relative to the package, not the repo
          # root. Leaving `file:` unset on these two lets the action
          # default to <context>/Dockerfile = ./model-service/Dockerfile.
          - name: model-service-cpu
            context: ./model-service
            platforms: linux/amd64
            build-args: |
              DEVICE=cpu
              BUILD_MODE=minimal
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~25 GB of preinstalled toolchains so the image builds have
      # ample disk headroom, matching docker.yml. (QEMU is gone: every image
      # builds amd64-native, no emulation.)
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          platforms: ${{ matrix.service.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build-args }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Deliberately independent of build-and-push-images (no `needs`): the
    # GitHub Release and its notes do not depend on the images. Coupling the
    # Release to the image builds is exactly how the v0.4.3 Release came to be
    # missing, so keeping this job independent guarantees a tag always
    # publishes a Release even if an image build fails.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES="$(mktemp)"
          # Extract the "## [VERSION]" section body from CHANGELOG.md (from the
          # version heading up to the next "## [" heading). `index(...)==1`
          # anchors on a literal heading so version numbers are not treated as
          # regex (the dots would otherwise match any character).
          awk -v ver="## [$VERSION]" \
            'index($0, ver) == 1 {f=1; next} f && /^## \[/ {exit} f' \
            CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::warning::No CHANGELOG section for $VERSION; using auto-generated notes"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TAG"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
            fi
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its notes from the changelog"
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            echo "Creating release $TAG from the changelog"
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          fi

  update-deployment:
    name: Update Deployment Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Update version in documentation
        run: |
          # Update version references in docs if needed
          echo "Release ${{ github.ref_name }} created"
          echo "Docker images pushed with tags:"
          echo "  - ${{ github.ref_name }}"
          echo "  - latest"
