name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # Frontend jobs run in parallel
  lint-frontend:
    name: Frontend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @fovea/annotation-tool lint

      - name: Type check
        run: pnpm --filter @fovea/annotation-tool exec tsc --noEmit

  test-frontend:
    name: Frontend / Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @fovea/annotation-tool test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: annotation-tool/coverage/
          retention-days: 30

  build-frontend:
    name: Frontend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @fovea/annotation-tool build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: annotation-tool/dist/
          retention-days: 7

  # Backend jobs run in parallel
  lint-backend:
    name: Backend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fovea/server exec prisma generate

      - name: Run ESLint
        run: pnpm --filter @fovea/server lint

      - name: Type check
        run: pnpm --filter @fovea/server exec tsc --noEmit

  test-backend:
    name: Backend / Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fovea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fovea/server exec prisma generate

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/fovea_test
        run: pnpm --filter @fovea/server exec prisma migrate deploy

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/fovea_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        run: pnpm --filter @fovea/server test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 30

  build-backend:
    name: Backend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fovea/server exec prisma generate

      - name: Build
        run: pnpm --filter @fovea/server build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: server/dist/
          retention-days: 7

  # Model service jobs run in parallel
  lint-model-service:
    name: Model Service / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: model-service/pyproject.toml

      - name: Install dependencies
        working-directory: model-service
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        working-directory: model-service
        run: ruff check .

      - name: Run ruff format check
        working-directory: model-service
        run: ruff format --check .

      - name: Run mypy
        working-directory: model-service
        run: mypy src/

  test-model-service:
    name: Model Service / Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: model-service/pyproject.toml

      - name: Install dependencies
        working-directory: model-service
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        working-directory: model-service
        run: pytest -m "not requires_models" --cov=src --cov-report=json --cov-report=term --cov-report=html -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-service-coverage
          path: |
            model-service/coverage.json
            model-service/htmlcov/
          retention-days: 30

  # Wikibase loader jobs run in parallel
  lint-wikibase:
    name: Wikibase Loader / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: wikibase/pyproject.toml

      - name: Install dependencies
        working-directory: wikibase
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        working-directory: wikibase
        run: ruff check .

      - name: Run ruff format check
        working-directory: wikibase
        run: ruff format --check .

      - name: Run mypy
        working-directory: wikibase
        run: mypy scripts/

  test-wikibase:
    name: Wikibase Loader / Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: wikibase/pyproject.toml

      - name: Install dependencies
        working-directory: wikibase
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        working-directory: wikibase
        run: pytest --cov=scripts --cov-report=term -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wikibase-coverage
          path: wikibase/coverage/
          retention-days: 30

  # E2E tests are skipped in CI: the full Playwright suite takes ~90 minutes
  # under docker compose and is run locally instead. Set `if:` back to `always()`
  # (or remove it) to re-enable when the runtime budget allows.
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @fovea/annotation-tool exec playwright install --with-deps chromium

      - name: Start Docker Compose services
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.e2e.yml ps backend | grep -q "(healthy)" \
              && docker compose -f docker-compose.e2e.yml ps frontend | grep -q "(healthy)"; then
              echo "All services healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Timeout waiting for services"
              docker compose -f docker-compose.e2e.yml ps
              docker compose -f docker-compose.e2e.yml logs --tail=200 backend
              docker compose -f docker-compose.e2e.yml logs --tail=100 frontend
              exit 1
            fi
            sleep 5
          done
          docker compose -f docker-compose.e2e.yml ps

      - name: Run E2E tests (smoke + functional + regression + accessibility)
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: 'true'
        # 90-minute budget covers the full 4-project suite (~379 tests at 2
        # workers under docker compose). Reporter list is added so the job log
        # records per-test pass/fail, which the default html-only reporter omits.
        run: pnpm --filter @fovea/annotation-tool exec playwright test --project=smoke --project=functional --project=regression --project=accessibility --reporter=list,html,json,junit
        timeout-minutes: 90

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.e2e.yml logs --tail=300 backend
          echo "=== Frontend Logs ==="
          docker compose -f docker-compose.e2e.yml logs --tail=200 frontend
          echo "=== Mock Model Service Logs ==="
          docker compose -f docker-compose.e2e.yml logs --tail=100 mock-model-service

      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: annotation-tool/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: annotation-tool/test-results/
          retention-days: 30

  # Quality gate - all checks must pass
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - lint-frontend
      - test-frontend
      - build-frontend
      - lint-backend
      - test-backend
      - build-backend
      - lint-model-service
      - lint-wikibase
      - test-wikibase
      # - test-e2e  # disabled (job has if: false; gate must not require it)
      # test-model-service disabled due to disk space constraints
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          {
            echo "## Quality Gate Results"
            echo ""
            echo "### Frontend"
            echo "- Lint: ${{ needs.lint-frontend.result }}"
            echo "- Tests: ${{ needs.test-frontend.result }}"
            echo "- Build: ${{ needs.build-frontend.result }}"
            echo ""
            echo "### Backend"
            echo "- Lint: ${{ needs.lint-backend.result }}"
            echo "- Tests: ${{ needs.test-backend.result }}"
            echo "- Build: ${{ needs.build-backend.result }}"
            echo ""
            echo "### Model Service"
            echo "- Lint: ${{ needs.lint-model-service.result }}"
            echo "- Tests: skipped (disk space constraints)"
            echo ""
            echo "### Wikibase Loader"
            echo "- Lint: ${{ needs.lint-wikibase.result }}"
            echo "- Tests: ${{ needs.test-wikibase.result }}"
            echo ""
            echo "### Integration"
            # echo "- E2E Tests: ${{ needs.test-e2e.result }}" — disabled
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail if any required job failed
          LINT_FRONTEND="${{ needs.lint-frontend.result }}"
          TEST_FRONTEND="${{ needs.test-frontend.result }}"
          BUILD_FRONTEND="${{ needs.build-frontend.result }}"
          LINT_BACKEND="${{ needs.lint-backend.result }}"
          TEST_BACKEND="${{ needs.test-backend.result }}"
          BUILD_BACKEND="${{ needs.build-backend.result }}"
          LINT_MODEL="${{ needs.lint-model-service.result }}"
          LINT_WIKIBASE="${{ needs.lint-wikibase.result }}"
          TEST_WIKIBASE="${{ needs.test-wikibase.result }}"
          # TEST_E2E="${{ needs.test-e2e.result }}"  # disabled

          if [ "$LINT_FRONTEND" != "success" ] || \
             [ "$TEST_FRONTEND" != "success" ] || \
             [ "$BUILD_FRONTEND" != "success" ] || \
             [ "$LINT_BACKEND" != "success" ] || \
             [ "$TEST_BACKEND" != "success" ] || \
             [ "$BUILD_BACKEND" != "success" ] || \
             [ "$LINT_MODEL" != "success" ] || \
             [ "$LINT_WIKIBASE" != "success" ] || \
             [ "$TEST_WIKIBASE" != "success" ]; then  # E2E disabled
            {
              echo ""
              echo "❌ Quality gate FAILED"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "✅ Quality gate PASSED"
          } >> "$GITHUB_STEP_SUMMARY"
