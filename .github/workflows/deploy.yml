name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      demo_mode:
        description: >
          Build for demo.fovea.video: frontend lands on the public tour
          catalogue (VITE_DEMO_PUBLIC=1) with MSW model-service mocks
          (VITE_TOUR_DEMO=1); backend has ALLOW_REGISTRATION=false; the
          model-service container is skipped; nginx serves the
          rate-limited demo profile. Defaults true because the only
          DEPLOY_HOST configured for this workflow is demo.fovea.video;
          uncheck this on a workflow_dispatch run if you ever wire up a
          non-demo target.
        type: boolean
        default: true
        required: false

# demo.fovea.video is the demo deployment by design. Every push to main
# rebuilds the frontend with the MSW tour-demo flags and skips the
# model-service container so visitors land on the public tour catalog
# (TourCataloguePage at /) with a small Sign-in CTA, ALLOW_REGISTRATION
# off, and nginx.demo.conf swapped in for the rate-limited auth profile.
# DEMO_MODE resolves to 'true' for push-to-main OR for a manual
# workflow_dispatch run with the demo_mode checkbox left at its default;
# only an explicit workflow_dispatch with demo_mode unchecked falls back
# to 'false'. Every step below that previously read inputs.demo_mode now
# reads env.DEMO_MODE so push triggers stop deploying the full stack.
env:
  # DEMO_MODE was originally 'true' for every push so demo.fovea.video
  # served the tour catalogue + anonymous-session flow. Pivoted off
  # that path before the CVPR demo because the catalogue's surface
  # (tours, MSW, demo seeder, anonymous-session, role-relaxed admin)
  # had too many interacting failure modes to ship in time. Flipped
  # to 'false' for push triggers so the deploy reverts to the prior
  # multi-user setup (registration on, real signed-in flow, no tour
  # catalogue, no model service). Manual workflow_dispatch with
  # demo_mode=true is still honoured for explicit demo-mode re-deploys
  # but no longer automatic.
  DEMO_MODE: ${{ inputs.demo_mode == true && 'true' || 'false' }}

# Serialize deploys per branch so back-to-back pushes don't race the
# server's docker cleanup (the failure mode was both runs trying to
# `docker compose up -d redis` at the same time, with the second hitting
# 'Conflict. The container name "/fovea-redis-1" is already in use').
# cancel-in-progress is false because a half-deployed image is worse
# than the queued one waiting an extra few minutes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fovea/server exec prisma generate

      - name: Type check frontend
        run: pnpm --filter @fovea/annotation-tool type-check

      - name: Lint frontend
        run: pnpm --filter @fovea/annotation-tool lint

      - name: Build backend (type-checks)
        run: pnpm --filter @fovea/server build

      - name: Lint backend
        run: pnpm --filter @fovea/server lint

  deploy:
    name: Deploy Application
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH permissions
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            whoami
            id
            cd ${{ secrets.DEPLOY_PATH }}
            touch .test-write-permissions
            rm .test-write-permissions
            echo 'Write permissions verified'
          "

      - name: Sync code to server
        run: |
          rsync -avz --delete --no-g --no-perms \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude /data \
            --exclude /videos \
            --exclude dist \
            --exclude build \
            --exclude .docusaurus \
            --exclude playwright-report \
            --exclude test-results \
            -e "ssh" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo '🔧 Updating environment...'
            # Environment file is managed on server, not overwritten
            # Ensure S3 storage is configured for video access
            if ! grep -q '^VIDEO_STORAGE_TYPE=' .env; then
              echo 'VIDEO_STORAGE_TYPE=s3' >> .env
            fi
            if ! grep -q '^S3_BUCKET=' .env; then
              echo 'S3_BUCKET=fovea-demo-data' >> .env
            fi
            if ! grep -q '^S3_REGION=' .env; then
              echo 'S3_REGION=us-east-1' >> .env
            fi
            if ! grep -q '^S3_PUBLIC_BUCKET=' .env; then
              echo 'S3_PUBLIC_BUCKET=false' >> .env
            fi

            # Update AWS credentials from GitHub secrets
            if grep -q '^AWS_ACCESS_KEY_ID=' .env; then
              sed -i 's|^AWS_ACCESS_KEY_ID=.*|AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}|' .env
            else
              echo 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' >> .env
            fi

            if grep -q '^AWS_SECRET_ACCESS_KEY=' .env; then
              sed -i 's|^AWS_SECRET_ACCESS_KEY=.*|AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}|' .env
            else
              echo 'AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' >> .env
            fi

            # Update admin password from GitHub secrets
            if grep -q '^ADMIN_PASSWORD=' .env; then
              sed -i 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}|' .env
            else
              echo 'ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}' >> .env
            fi

            # Ensure FOVEA_MODE is set to multi-user
            if grep -q '^FOVEA_MODE=' .env; then
              sed -i 's|^FOVEA_MODE=.*|FOVEA_MODE=multi-user|' .env
            else
              echo 'FOVEA_MODE=multi-user' >> .env
            fi

            # Registration policy. The demo.fovea.video workflow run
            # (workflow_dispatch with demo_mode=true) disables self-
            # registration so the QR-code traffic profile is anonymous-
            # only; the booth operator mints real accounts via the
            # admin console's Create User dialog. Regular pushes to
            # main keep registration enabled.
            ALLOW_REGISTRATION_VALUE=true
            if [ \"${{ env.DEMO_MODE }}\" = \"true\" ]; then
              ALLOW_REGISTRATION_VALUE=false
            fi
            if grep -q '^ALLOW_REGISTRATION=' .env; then
              sed -i \"s|^ALLOW_REGISTRATION=.*|ALLOW_REGISTRATION=\$ALLOW_REGISTRATION_VALUE|\" .env
            else
              echo \"ALLOW_REGISTRATION=\$ALLOW_REGISTRATION_VALUE\" >> .env
            fi

            # Frontend demo-mode build flags. These flip the SPA into
            # the public tour catalogue landing + MSW model-service
            # interception that demo.fovea.video ships. Regular
            # pushes to main blank both so the demo subtree tree-
            # shakes out of the production bundle.
            if [ \"${{ env.DEMO_MODE }}\" = \"true\" ]; then
              VITE_TOUR_DEMO_VALUE=1
              VITE_DEMO_PUBLIC_VALUE=1
            else
              VITE_TOUR_DEMO_VALUE=
              VITE_DEMO_PUBLIC_VALUE=
            fi
            if grep -q '^VITE_TOUR_DEMO=' .env; then
              sed -i \"s|^VITE_TOUR_DEMO=.*|VITE_TOUR_DEMO=\$VITE_TOUR_DEMO_VALUE|\" .env
            else
              echo \"VITE_TOUR_DEMO=\$VITE_TOUR_DEMO_VALUE\" >> .env
            fi
            if grep -q '^VITE_DEMO_PUBLIC=' .env; then
              sed -i \"s|^VITE_DEMO_PUBLIC=.*|VITE_DEMO_PUBLIC=\$VITE_DEMO_PUBLIC_VALUE|\" .env
            else
              echo \"VITE_DEMO_PUBLIC=\$VITE_DEMO_PUBLIC_VALUE\" >> .env
            fi

            # Swap nginx config when demo_mode is on so the auth-
            # endpoint rate limits take effect. The Dockerfile COPYs
            # annotation-tool/nginx.conf at image build time, so we
            # overwrite the file on disk BEFORE the docker build runs
            # below. The prior rsync step always ships the canonical
            # nginx.conf from git, so a subsequent demo_mode=false
            # deploy restores the standard config automatically; the
            # demo overwrite is therefore safely scoped to a single
            # deploy.
            if [ \"${{ env.DEMO_MODE }}\" = \"true\" ]; then
              cp annotation-tool/nginx.demo.conf annotation-tool/nginx.conf
              echo 'Swapped nginx config to nginx.demo.conf for demo mode'
            else
              # Belt-and-suspenders: if a prior demo_mode=true deploy
              # left a stale nginx.conf on disk and rsync somehow
              # skipped it (e.g. timestamp tie), force the canonical
              # file back by checking out from the synced tree's
              # docker-image source of truth.
              echo 'demo_mode=false: nginx.conf left at the rsynced canonical version'
            fi

            # Ensure online Wikidata mode (not local Wikibase) for demo
            if grep -q '^WIKIDATA_MODE=' .env; then
              sed -i 's|^WIKIDATA_MODE=.*|WIKIDATA_MODE=online|' .env
            else
              echo 'WIKIDATA_MODE=online' >> .env
            fi

            # Backend demo-mode flags. FOVEA_DEMO_MODE gates the demo
            # plugin tree in server/src/demo (anonymous-session route,
            # idle-reset sweeper, demo seed route) AND the
            # VideoAccessService override that returns the full video
            # corpus to non-admin callers — without it, the auto-issued
            # demo-anonymous-* booth visitors hit /api/videos with
            # systemRole='user' and get an empty list (the per-user
            # sharing / group / project chain has nothing to enumerate
            # for a freshly-minted anon user), the VideoBrowser renders
            # "No videos found", and every tour anchored to a video
            # card or the annotation workspace shows the missing-anchor
            # banner. FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH is the secondary
            # gate that actually registers the POST /api/demo/anonymous-
            # session endpoint the frontend bootstrap calls on first
            # paint (main.tsx::maybeBootstrapDemoSession). Both default
            # to unset on non-demo deploys so a self-hosted production
            # build cannot accidentally serve anonymous sessions or
            # expose the full corpus to a non-admin caller.
            if [ \"${{ env.DEMO_MODE }}\" = \"true\" ]; then
              FOVEA_DEMO_MODE_VALUE=true
              FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH_VALUE=true
            else
              FOVEA_DEMO_MODE_VALUE=false
              FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH_VALUE=false
            fi
            if grep -q '^FOVEA_DEMO_MODE=' .env; then
              sed -i \"s|^FOVEA_DEMO_MODE=.*|FOVEA_DEMO_MODE=\$FOVEA_DEMO_MODE_VALUE|\" .env
            else
              echo \"FOVEA_DEMO_MODE=\$FOVEA_DEMO_MODE_VALUE\" >> .env
            fi
            if grep -q '^FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH=' .env; then
              sed -i \"s|^FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH=.*|FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH=\$FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH_VALUE|\" .env
            else
              echo \"FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH=\$FOVEA_DEMO_ALLOW_ANONYMOUS_AUTH_VALUE\" >> .env
            fi

            # Ensure external links are enabled for demo
            if grep -q '^ALLOW_EXTERNAL_LINKS=' .env; then
              sed -i 's|^ALLOW_EXTERNAL_LINKS=.*|ALLOW_EXTERNAL_LINKS=true|' .env
            else
              echo 'ALLOW_EXTERNAL_LINKS=true' >> .env
            fi

            echo '📁 Creating required directories...'
            mkdir -p data/thumbnails

            # Try to set permissions, but don't fail if we can't
            # (directory may be owned by Docker from previous deployment)
            if chmod 777 data/thumbnails 2>/dev/null; then
              echo 'Set permissions for thumbnails directory'
            else
              echo 'Could not chmod thumbnails directory (likely owned by Docker)'
              # Verify directory is still writable
              if [ -w data/thumbnails ]; then
                echo 'Directory is writable - OK to continue'
              else
                echo 'WARNING: thumbnails directory is not writable'
              fi
            fi

            echo '🧹 Pre-build cleanup to free disk space...'
            docker image prune -f
            docker builder prune -af
            df -h /

            echo '💾 Checking available disk space...'
            AVAIL=\$(df --output=avail / | tail -1)
            if [ \"\$AVAIL\" -lt 2097152 ]; then
              echo 'FATAL: Less than 2GB disk space available after cleanup'
              df -h /
              exit 1
            fi
            echo \"Available: \$((\$AVAIL / 1024))MB\"

            echo '🐳 Building containers...'
            # Skip the model-service image on the demo host. The demo
            # server cannot withstand CVPR-scale concurrent inference
            # requests; the modelsDisabled gate in the frontend greys
            # out every inference button when /api/models/config 503s,
            # which is what happens when no model-service container
            # exists. Skipping the build also avoids the ~5 GB CPU
            # image rebuild on every deploy. The minimal-CPU image
            # is still published from docker.yml for any downstream
            # stack that wants it; the live demo backup the CVPR demo
            # runs locally builds its full-CPU variant with docker
            # compose directly.
            docker compose build --parallel backend frontend

            # Industry-standard pre-deploy cleanup. Must run BEFORE
            # any 'docker compose up' so the name-conflict and
            # phantom-id races (see big block below for explanation)
            # do not bite the very first infra-up call. Covers every
            # service compose owns — not just the application
            # containers — because redis/postgres/otel-collector
            # also keep their canonical names across deploys.
            echo '🧹 Full pre-deploy cleanup (all services)...'
            docker compose stop 2>/dev/null || true
            docker compose down --remove-orphans 2>/dev/null || true
            for c in fovea-backend-1 fovea-frontend-1 fovea-model-service-1 \
                     fovea-redis-1 fovea-postgres-1 fovea-otel-collector-1 \
                     fovea-prometheus-1 fovea-grafana-1; do
              docker rm -f \"\$c\" 2>/dev/null || true
            done
            # When two deploys land within ~1 minute the GitHub-Actions
            # job-concurrency guarantee does not extend to the SSH
            # session that owns docker — overlapping cleanup + up calls
            # leave Docker's in-memory container index out of sync with
            # the daemon's actual state and the next 'docker compose up
            # -d redis' fails with 'Conflict. The container name
            # \"/fovea-redis-1\" is already in use by container ...'
            # even though the cleanup said it removed it. Wait for the
            # daemon to flush, then forcibly retry the conflict.
            sleep 3
            docker ps -aq --filter 'name=^/fovea-' | xargs -r docker rm -f 2>/dev/null || true

            echo '🔍 Verifying Redis health before full startup...'
            # Two-attempt wrap: if the first up still hits a conflict
            # because a concurrent deploy is mid-cleanup, sleep + retry
            # once with a forced container prune in between.
            if ! docker compose up -d redis 2>&1 | tee /tmp/redis-up.log; then
              if grep -q 'is already in use' /tmp/redis-up.log; then
                echo '⚠️  redis container conflict — pruning and retrying'
                docker ps -aq --filter 'name=^/fovea-redis-1' | xargs -r docker rm -f
                sleep 2
                docker compose up -d redis
              else
                echo '✗ redis up failed for a non-conflict reason'
                exit 1
              fi
            fi
            sleep 5
            if ! docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo '⚠️  Redis unhealthy - removing corrupted data volume and restarting...'
              docker compose stop redis
              docker compose rm -f redis
              docker volume rm fovea_redis-data 2>/dev/null || true
              docker compose up -d redis
              sleep 5
              if ! docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
                echo 'FATAL: Redis still unhealthy after volume reset'
                docker compose logs redis
                exit 1
              fi
              echo '✅ Redis recovered after volume reset'
            else
              echo '✅ Redis is healthy'
            fi

            echo '🚀 Starting infrastructure containers...'
            docker compose up -d --no-deps postgres redis otel-collector
            # model-service is never started on demo.fovea.video.
            # The frontend's modelsDisabled gate greys every
            # inference button when /api/models/config 503s, which
            # is the steady-state with no model-service container.
            docker compose up -d --no-deps prometheus grafana

            echo '⏳ Waiting for postgres to be ready...'
            for i in {1..20}; do
              if docker compose exec -T postgres pg_isready -U fovea 2>/dev/null; then
                echo '✅ Postgres ready'
                break
              fi
              if [ \$i -eq 20 ]; then
                echo 'FATAL: Postgres did not become ready in time'
                docker compose logs --tail=80 postgres
                exit 1
              fi
              sleep 2
            done

            echo '🔄 Running database migrations (out-of-band)...'
            if ! docker compose run --rm --no-deps -T backend sh -c 'npx prisma migrate deploy'; then
              echo '❌ Migrations failed.'
              docker compose logs --tail=80 postgres
              exit 1
            fi

            echo '👤 Seeding database (out-of-band)...'
            if ! docker compose run --rm --no-deps -T backend sh -c 'node prisma/seed.cjs'; then
              echo '⚠️  Seed failed - check ADMIN_PASSWORD is set'
            fi

            echo '🚀 Starting application containers...'
            # demo_mode skips the model-service service entirely; the
            # frontend bundle's MSW worker intercepts model-service
            # routes so there is nothing to start. In non-demo mode we
            # pass no service args at all so docker compose brings up
            # every service in docker-compose.yml. A bare empty-string
            # arg is treated by compose as a literal service name and
            # errors with 'no such service: \"\"', so we must branch
            # the whole command rather than interpolate an empty var.
            # Pre-up cleanup ran earlier (Full pre-deploy cleanup,
            # before 'docker compose build') so infrastructure is
            # already in a clean state. We just need to up the app
            # containers here. Compose 2.x's --force-recreate
            # remains as belt-and-suspenders against the name-
            # conflict (a) and phantom-id (b) races.
            # Both DEMO_MODE branches restrict the app start to
            # backend + frontend so the non-DEMO catch-all 'docker
            # compose up -d --force-recreate' (which would otherwise
            # bring up every service in docker-compose.yml,
            # including model-service) is replaced by an explicit
            # service list. Keeps the demo host's load profile flat
            # for CVPR-scale traffic.
            UP_CMD='docker compose up -d --force-recreate backend frontend'
            if ! eval \$UP_CMD; then
              echo '❌ docker compose up failed — dumping logs from every service:'
              docker compose ps
              echo '--- backend logs ---'
              docker compose logs --tail=300 backend || true
              echo '--- frontend logs ---'
              docker compose logs --tail=100 frontend || true
              echo '--- model-service logs ---'
              docker compose logs --tail=100 model-service || true
              echo '--- postgres logs ---'
              docker compose logs --tail=80 postgres || true
              echo '--- redis logs ---'
              docker compose logs --tail=40 redis || true
              exit 1
            fi

            echo '⏳ Waiting for backend to be healthy...'
            BACKEND_HEALTHY=false
            for i in {1..60}; do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo '✅ Backend is healthy'
                BACKEND_HEALTHY=true
                break
              fi
              echo \"Waiting for backend... (\$i/60)\"
              sleep 2
            done

            if [ \"\$BACKEND_HEALTHY\" != \"true\" ]; then
              echo '❌ Backend never became healthy — dumping logs:'
              docker compose ps
              echo '--- backend logs ---'
              docker compose logs --tail=300 backend || true
              echo '--- model-service logs ---'
              docker compose logs --tail=100 model-service || true
              exit 1
            fi

            echo '📹 Syncing videos from S3 to database...'
            # POST /api/videos/sync is admin-only (onRequest: [requireAdmin]),
            # so a bare curl returns 401. Log in as admin first with the
            # seeded credentials, then POST sync carrying the session cookie.
            COOKIE_JAR=\$(mktemp)
            if curl -sf -c \"\$COOKIE_JAR\" -X POST http://localhost:3001/api/auth/login \\
                 -H 'Content-Type: application/json' \\
                 -d '{\"username\":\"admin\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}' > /dev/null; then
              curl -sf -b \"\$COOKIE_JAR\" -X POST http://localhost:3001/api/videos/sync \\
                || echo '⚠️  Video sync failed, videos may need manual sync'
            else
              echo '⚠️  Could not authenticate as admin for video sync; skipping (check secrets.ADMIN_PASSWORD)'
            fi
            rm -f \"\$COOKIE_JAR\"

            echo '🧹 Post-deploy cleanup...'
            docker image prune -f

            echo '✅ Deployment complete!'
          "

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for services to be healthy..."
          sleep 60

          # Check backend health
          curl --fail https://demo.fovea.video/api/health || exit 1

          # Check frontend
          curl --fail -I https://demo.fovea.video || exit 1

          echo "✅ All services healthy"

      - name: Run smoke tests
        run: |
          echo "🧪 Running post-deployment smoke tests..."

          # Test backend API
          echo "Testing backend API..."
          curl --fail -s https://demo.fovea.video/api/health | grep -q "healthy" || exit 1

          # Test frontend loads
          echo "Testing frontend loads..."
          curl --fail -s https://demo.fovea.video | grep -q "<!doctype html>" || exit 1

          # Test video listing endpoint requires authentication
          echo "Testing video auth..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://demo.fovea.video/api/videos)
          if [ "$HTTP_CODE" != "401" ]; then
            echo "Expected 401 from /api/videos, got $HTTP_CODE"
            exit 1
          fi

          echo "✅ Smoke tests passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above."

  deploy-docs:
    name: Deploy Documentation
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy documentation
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            export PATH=\$HOME/.nvm/versions/node/v20.19.5/bin:\$PATH
            cd ${{ secrets.DEPLOY_PATH }}/docs

            echo '📦 Installing docs dependencies...'
            npm ci

            # Atomic build: write the docusaurus output into a
            # SEPARATE staging directory (build-staging) so the live
            # build/ that nginx serves never gets touched until the
            # new build is fully written. Docusaurus's --out-dir lets
            # us redirect output without touching the live directory.
            # If npm run build fails partway through (OOM, killed
            # SSH session, network glitch hitting the docs sources),
            # the live site keeps serving the previous good build
            # instead of returning 500s from a half-empty directory
            # — the failure mode that took fovea.video down on
            # 2026-06-05.
            echo '🏗️ Building documentation into build-staging/...'
            rm -rf build-staging
            npx docusaurus build --out-dir build-staging

            # Pre-flight checks before swapping: the new build must
            # contain at least index.html plus the assets and docs
            # subdirectories. A docusaurus build that wrote only
            # __server (the SSR bundle, written first) is the exact
            # shape that took fovea.video down at 15:36 UTC — the
            # process was killed between the server emit and the
            # client emit, leaving a directory that looked populated
            # to a casual ls but served no content. Refuse to
            # promote a build that fails the shape check.
            test -f build-staging/index.html
            test -d build-staging/assets
            test -d build-staging/docs
            BUILD_SIZE=\$(du -sb build-staging | awk '{print \$1}')
            if [ \$BUILD_SIZE -lt 1048576 ]; then
              echo \"❌ build-staging size is \$BUILD_SIZE bytes — refusing to promote a sub-megabyte build\"
              exit 1
            fi
            echo \"✓ build-staging shape and size (\$BUILD_SIZE bytes) check pass\"

            # Promote: move the existing build aside to
            # build-previous, then move build-staging into place.
            # The two mv calls are NOT a single atomic operation —
            # an SSH disconnect between them leaves the site
            # serving the empty build/ that was renamed to
            # build-previous — but the window is microseconds and
            # the build-previous fallback below recovers in that
            # case. Keep only the immediately-previous build so the
            # disk does not accumulate stale builds forever.
            echo '🔁 Promoting staged build to live...'
            rm -rf build-previous-old
            if [ -d build-previous ]; then
              mv build-previous build-previous-old
            fi
            if [ -d build ]; then
              mv build build-previous
            fi
            mv build-staging build
            rm -rf build-previous-old

            echo '✅ Documentation deployed atomically.'
          "

      - name: Roll back docs on verify failure
        if: failure()
        run: |
          # If the verify-step below ever fails, recover the
          # previous build automatically. The site goes back to
          # serving last-known-good content within seconds instead
          # of waiting for an operator to notice and re-run the
          # deploy.
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }}/docs
            if [ -d build-previous ]; then
              echo '⏪ Rolling back docs to build-previous...'
              rm -rf build-bad
              mv build build-bad || true
              mv build-previous build
              mv build-bad build-previous || true
              echo '✅ Rollback complete.'
            else
              echo '⚠️  build-previous not available — cannot roll back.'
              exit 1
            fi
          "

      - name: Verify docs deployment
        run: |
          sleep 10
          # Docs continue to serve under the apex GitHub Pages domain
          # (fovea.video/docs/*) per the apex topology kept in 0.4.0;
          # the docs/static/CNAME and docs/docusaurus.config.ts pair
          # both point at fovea.video to match.
          curl --fail -I https://fovea.video/docs/ || exit 1
          echo "✅ Documentation site healthy"
