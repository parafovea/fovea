# Development environment configuration
#
# Extends docker-compose.yml with development-specific features:
# - Hot-reload volumes for code changes (no rebuild needed)
# - Jaeger distributed tracing (http://localhost:16686)
# - Maildev email testing (http://localhost:1080)
# - Development commands with auto-reload
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# See docs/docs/reference/docker-commands.md for full documentation.

services:
  frontend:
    build:
      target: builder  # Use builder stage for development
    working_dir: /repo/annotation-tool
    volumes:
      - ./annotation-tool/src:/repo/annotation-tool/src:ro
      - ./annotation-tool/public:/repo/annotation-tool/public:ro
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://backend:3001  # Use Docker service name for inter-container communication (for Vite proxy)
      - VITE_API_URL=  # Empty = use relative URLs that go through Vite proxy
    command: pnpm dev -- --host 0.0.0.0 --port 3000

  backend:
    build:
      target: builder  # Use builder stage which has devDependencies (tsx)
    working_dir: /repo/server
    volumes:
      - ./server/src:/repo/server/src:ro
      - ./server/prisma:/repo/server/prisma:ro
    environment:
      - NODE_ENV=development
    command: sh -c "./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/prisma db seed && pnpm dev"

  model-service:
    volumes:
      - ./model-service/src:/app/src:ro
    environment:
      - LOG_LEVEL=debug
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Add Jaeger for distributed tracing in development
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Collector HTTP
      - "14250:14250"  # Collector gRPC
    networks:
      - fovea-network
    restart: unless-stopped

  # Development mail catcher for testing email
  maildev:
    image: maildev/maildev:latest
    ports:
      - "1080:1080"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - fovea-network
    restart: unless-stopped
