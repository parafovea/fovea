# nginx config for demo.fovea.video.
#
# Layers rate limits + caching tweaks on top of the standard
# nginx.conf for the QR-code traffic profile: many one-shot visitors,
# very few logged-in users, zero model-service container behind it.
#
# Engaged by the deploy.yml demo_mode workflow input which copies
# this file into the frontend image at /etc/nginx/conf.d/default.conf
# instead of the standard nginx.conf.

# Two rate-limit zones, scoped per IP. Conference venue networks
# (CVPR booth WiFi, university campus uplinks) routinely NAT 200+
# visitors behind a single source address, so the per-IP ceilings
# have to assume the IP is shared by a whole crowd, not a single
# user. The numbers below leave headroom for the entire booth queue
# hitting Login at once while still cutting off a credential-stuffing
# botnet long before the backend pool saturates.
#  - login_zone: 600 req/min sustained, burst 100. Even a packed
#    booth with everyone clicking Login simultaneously stays under
#    the ceiling; a sustained scripted flood gets 429s.
#  - register_zone: 60 req/min sustained, burst 20. Registration is
#    disabled on this deployment (ALLOW_REGISTRATION=false on the
#    backend), but defense-in-depth is cheap so we throttle the
#    public path too in case the env var is flipped accidentally.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=register_zone:10m rate=60r/m;
limit_req_status 429;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Throttle the auth surfaces. burst absorbs the typical user's
    # double-click on Login without blocking, but a sustained flood
    # gets 429s well before the backend pool saturates.
    location = /api/auth/login {
        limit_req zone=login_zone burst=100 nodelay;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        limit_req zone=register_zone burst=20 nodelay;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the rest of the API surface to the backend with the
    # standard proxy headers + video-range support.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA routing. The tour catalogue lives at /, so this matches
    # for both the public landing and the deep links inside the app.
    # index.html itself is no-store so admin edits to
    # tour-content.json land on the next page load without a
    # cache-buster.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static assets get long immutable caching. The bundle filenames
    # are content-hashed, so a new deploy invalidates by name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # tour-content.json is the admin-editable runtime config. NEVER
    # cache it; an admin edit must take effect on the next reload.
    location = /tour-content.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # mockServiceWorker.js is the MSW registration script that loads
    # before React mounts. Cache for a minute so a deploy that
    # changes the worker version propagates quickly without making
    # every QR-code visitor re-download it on each visit.
    location = /mockServiceWorker.js {
        expires 1m;
        add_header Cache-Control "public, max-age=60";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
