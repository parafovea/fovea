receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: fovea

  debug:
    # `basic` emits periodic per-signal summary counts. `detailed` dumps every
    # span and every metric data point to stderr in full, which with an
    # unbounded json-file log driver fills the host disk (it grew one
    # collector's log to 70GB and wedged demo.fovea.video). Keep it at `basic`.
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
